<!--
  ========================================================================
  COMO CONFIGURAR (uma única vez, feito por quem hospeda o app):

  1) Crie um projeto grátis em https://console.firebase.google.com
  2) No projeto: Build > Firestore Database > Create database > modo de teste
  3) Na aba "Regras" do Firestore, cole isto e publique:

       rules_version = '2';
       service cloud.firestore {
         match /databases/{database}/documents {
           match /posts/{postId} {
             allow read, write: if true;
           }
         }
       }

     (Isso deixa a coleção "posts" aberta para qualquer pessoa ler e
     escrever, sem precisar de login — é exatamente o que foi pedido.
     Não coloque nada sensível neste app.)

  4) Configurações do projeto (ícone de engrenagem) > Geral > "Seus apps"
     > ícone "</>" (Web) > registre um app > copie o objeto
     firebaseConfig que aparece.

  5) Cole esse objeto no lugar de FIREBASE_CONFIG_AQUI logo abaixo.

  6) Hospede este arquivo .html em qualquer lugar público: Firebase
     Hosting, GitHub Pages, Netlify, etc. O link que você receber é o
     que você compartilha — quem abrir não precisa logar em nada.
  ========================================================================
-->

<style>
:root{
  color-scheme: dark;
  --bg:#0A0A0F; --surface:#121018; --surface-2:#17151F; --surface-3:#211F2B; --line:#242130;
  --text:#F5F3F7; --text-2:#9A94AC; --text-3:#6F6885;
  --purple:#A855F7; --purple-press:#9333EA; --purple-soft:rgba(168,85,247,.16); --purple-line:rgba(168,85,247,.45);
  --red:#EF4444; --red-soft:#3B1418; --red-text:#FCA5A5;
  --green:#22C55E; --green-soft:#10301D; --green-text:#86EFAC;
  --blue:#3B82F6; --blue-soft:#0F2238; --blue-text:#93C5FD;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
}
*,*:before,*:after{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body.sheet-open{overflow:hidden}
h1,h2,p{margin:0}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--purple);outline-offset:2px}
.app{min-height:100dvh;display:flex;flex-direction:column}
.header{flex:none;padding:calc(var(--safe-t) + 14px) calc(16px + var(--safe-r)) 0 calc(16px + var(--safe-l))}
.header-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.header-top h1{font-size:20px;font-weight:800;letter-spacing:-.01em}
.week-nav{display:flex;align-items:center;gap:6px}
.icon-btn{width:36px;height:36px;flex:none;display:grid;place-items:center;border:0;border-radius:11px;background:var(--surface-2);color:var(--text)}
.icon-btn:active{background:var(--surface-3)}
.week-label{font-size:13px;color:var(--text-2);min-width:112px;text-align:center}
.sync-note{font-size:11px;color:var(--text-3);margin-top:6px}
.sync-note.is-error{color:var(--red-text)}
.stats{display:flex;align-items:center;justify-content:space-around;margin-top:14px;padding:13px 6px;background:var(--surface);border-radius:16px}
.stat{display:flex;flex-direction:column;align-items:center;gap:4px}
.stat .num{display:flex;align-items:center;gap:6px;font-size:16px;font-weight:700}
.dot{width:8px;height:8px;border-radius:999px;display:inline-block;flex:none}
.stat .lbl{font-size:11px;color:var(--text-2)}
.divider{width:1px;height:28px;background:var(--line)}
.days{display:flex;gap:6px;margin-top:14px}
.day{flex:1;display:flex;flex-direction:column;align-items:center;gap:5px;background:var(--surface);border:1.5px solid transparent;border-radius:14px;padding:8px 0;min-height:52px}
.day.is-selected{border-color:var(--purple);background:#1F1A2E}
.day .dots{display:flex;gap:2px;height:4px}
.day .dot{width:4px;height:4px}
.day .ab{font-size:10px;color:var(--text-3)}
.day.is-selected .ab{color:#C9C2DB}
.day .num{font-size:14px;font-weight:700}
.day.is-today .num{color:var(--purple)}
.content{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px calc(16px + var(--safe-r)) 120px calc(16px + var(--safe-l))}
.section-title{font-size:13px;font-weight:700;color:#C9C2DB;margin-bottom:10px}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:48px 20px}
.empty-icon{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--purple-soft);color:var(--purple)}
.empty p{color:var(--text-2);font-size:14px;max-width:30ch}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:13px;border:1px solid transparent;font-weight:650;font-size:15px;cursor:pointer}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--purple);color:#1A0B2E}
.btn-secondary{background:var(--surface-2);color:var(--text);border-color:var(--line)}
.btn-danger{background:transparent;color:#FF8080}
.btn-block{width:100%}
.post{display:flex;gap:8px;align-items:center;width:100%;background:var(--surface);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.post .bar{width:4px;align-self:stretch;border-radius:999px;flex:none}
.post .main{flex:1;min-width:0}
.post .top{display:flex;align-items:baseline;gap:8px}
.post .time{font-size:13px;font-weight:700}
.post .type{font-size:11px;color:var(--text-3)}
.post .cap{font-size:13px;color:#D7D2E2;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{flex:none;font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px}
.badge-pendente{background:var(--red-soft);color:var(--red-text)}
.badge-postado{background:var(--green-soft);color:var(--green-text)}
.badge-removido{background:var(--blue-soft);color:var(--blue-text)}
.fab{position:fixed;right:calc(18px + var(--safe-r));bottom:calc(var(--safe-b) + 22px);z-index:30;width:58px;height:58px;border-radius:19px;border:0;display:grid;place-items:center;background:var(--purple);color:#1A0B2E;box-shadow:0 10px 28px rgba(168,85,247,.45),0 2px 6px rgba(0,0,0,.5)}
.fab:active{transform:scale(.93);background:var(--purple-press)}
.sheet-layer{position:fixed;inset:0;z-index:50}
.sheet-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.62)}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;max-height:calc(100dvh - var(--safe-t) - 16px);display:flex;flex-direction:column;background:#141218;border-radius:24px 24px 0 0;border-top:1px solid var(--line)}
.sheet-grabber{width:36px;height:5px;border-radius:3px;background:var(--surface-3);margin:8px auto 0;flex:none}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px 6px 20px;flex:none}
.sheet-head h2{font-size:18px;font-weight:750}
.sheet-body{flex:1;min-height:0;overflow-y:auto;padding:8px 20px calc(16px + var(--safe-b))}
.field{display:flex;flex-direction:column;gap:7px;margin-bottom:16px}
.field label{font-size:13px;font-weight:600;color:var(--text-2)}
.input,.select,.textarea{width:100%;min-height:46px;padding:11px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--text);font:inherit;font-size:16px;outline:none;-webkit-appearance:none;appearance:none}
.input:focus,.select:focus,.textarea:focus{border-color:var(--purple)}
.textarea{min-height:76px;resize:vertical;line-height:1.4}
.segmented{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.segmented button{min-height:42px;border-radius:11px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--text-2);font-weight:650;font-size:13px;display:flex;align-items:center;justify-content:center;gap:6px}
.segmented button.is-active.opt-pendente{background:var(--red-soft);color:var(--red-text);border-color:var(--red)}
.segmented button.is-active.opt-postado{background:var(--green-soft);color:var(--green-text);border-color:var(--green)}
.segmented button.is-active.opt-removido{background:var(--blue-soft);color:var(--blue-text);border-color:var(--blue)}
.daychips{display:flex;flex-wrap:wrap;gap:8px}
.daychip{display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--text-2);font-size:13px;font-weight:600}
.daychip.is-checked{border-color:var(--purple);background:var(--purple-soft);color:#E9D5FF}
.daychip-check{width:16px;height:16px;border-radius:5px;border:1.5px solid var(--text-3);display:flex;align-items:center;justify-content:center;color:#fff;flex:none}
.daychip.is-checked .daychip-check{border-color:var(--purple);background:var(--purple)}
.checkbox-row{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:600;color:var(--text)}
.checkbox-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--purple);flex:none}
.reminder-lead{margin-top:8px}
.post-bell{flex:none;width:34px;height:34px;display:grid;place-items:center;border:0;border-radius:11px;background:var(--surface-2);color:var(--text-2)}
.post-bell:active{background:var(--surface-3);color:var(--purple)}
.post-main{flex:1;min-width:0;display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;text-align:left;color:inherit}
.post-main:active{opacity:.75}
.sheet-actions{display:flex;flex-direction:column;gap:10px;margin-top:4px}
.confirm-layer{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:24px}
.confirm-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.7)}
.confirm{position:relative;width:100%;max-width:320px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 18px 16px;display:flex;flex-direction:column;gap:14px}
.confirm h2{font-size:17px}
.confirm p{color:var(--text-2);font-size:14px}
.confirm-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div id="app" class="app"></div>

<script>
(function(){
  "use strict";

  var DAY_LABELS = ["Seg","Ter","Qua","Qui","Sex","Sáb","Dom"];
  var MONTHS = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
  var TYPES = ["Feed","Stories","Reels","Carrossel"];
  var STATUSES = [
    {id:"pendente", label:"Pendente"},
    {id:"postado", label:"Postado"},
    {id:"removido", label:"Removido"}
  ];

  function pad(n){ return String(n).padStart(2,"0"); }
  function toISODate(d){ return d.getFullYear() + "-" + pad(d.getMonth()+1) + "-" + pad(d.getDate()); }
  function fromISODate(s){ var p = s.split("-"); return new Date(parseInt(p[0],10), parseInt(p[1],10)-1, parseInt(p[2],10)); }
  function getMonday(d){
    d = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    var day = d.getDay();
    var diff = (day === 0 ? -6 : 1 - day);
    d.setDate(d.getDate() + diff);
    return d;
  }
  function addDays(d, n){ var r = new Date(d); r.setDate(r.getDate()+n); return r; }
  function uid(){ return "p" + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function escapeHtml(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];
    });
  }

  var todayISO = toISODate(new Date());

  var state = {
    weekStart: getMonday(new Date()),
    selectedDate: todayISO,
    posts: [],
    syncStatus: "connecting", // connecting | live | error
    sheet: null,       // { mode: 'add' | 'edit', draft: {...} }
    confirmDeleteId: null
  };

  // ---------- persistence (Firestore, no login) ----------

  var db = null;
  var LOCAL_KEY = "ig_posts_schedule_v1";

  function loadLocalPosts(){
    try{
      var raw = localStorage.getItem(LOCAL_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr : [];
    }catch(e){ return []; }
  }
  function saveLocalPosts(){
    try{ localStorage.setItem(LOCAL_KEY, JSON.stringify(state.posts)); }catch(e){}
  }
  function cleanPostData(post){
    var clean = {};
    ["date","time","type","caption","status","reminder","reminderLead"].forEach(function(k){
      clean[k] = post[k] === undefined ? null : post[k];
    });
    return clean;
  }
  function persistUpsert(post){
    saveLocalPosts();
    if(!db) return;
    db.collection("posts").doc(post.id).set(cleanPostData(post))
      .catch(function(e){ console.error("Posts app: falha ao salvar", e); });
  }
  function persistDelete(id){
    saveLocalPosts();
    if(!db) return;
    db.collection("posts").doc(id).delete()
      .catch(function(e){ console.error("Posts app: falha ao excluir", e); });
  }
  function initApp(){
    state.posts = loadLocalPosts();
    render();

    if(!window.firebase || !FIREBASE_CONFIG_AQUI || FIREBASE_CONFIG_AQUI.apiKey === "COLE_AQUI"){
      state.syncStatus = "error";
      render();
      return;
    }

    try{
      firebase.initializeApp(FIREBASE_CONFIG_AQUI);
      db = firebase.firestore();
      db.collection("posts").onSnapshot(function(snapshot){
        var arr = [];
        snapshot.forEach(function(doc){
          arr.push(Object.assign({ id: doc.id }, doc.data()));
        });
        state.posts = arr;
        state.syncStatus = "live";
        saveLocalPosts();
        render();
      }, function(err){
        console.error("Posts app: erro de sincronização", err);
        state.syncStatus = "error";
        render();
      });
    }catch(e){
      console.error("Posts app: falha ao iniciar Firebase", e);
      state.syncStatus = "error";
      render();
    }
  }

  function weekDates(){
    var out = [];
    for(var i=0;i<7;i++) out.push(addDays(state.weekStart, i));
    return out;
  }
  function weekLabel(){
    var dates = weekDates();
    var a = dates[0], b = dates[6];
    if(a.getMonth() === b.getMonth()){
      return a.getDate() + " – " + b.getDate() + " de " + MONTHS[a.getMonth()];
    }
    return a.getDate() + " " + MONTHS[a.getMonth()] + " – " + b.getDate() + " " + MONTHS[b.getMonth()];
  }
  function postsOnDate(dateISO){
    return state.posts.filter(function(p){ return p.date === dateISO; })
      .sort(function(a,b){ return (a.time||"").localeCompare(b.time||""); });
  }
  function weekCounts(){
    var dates = weekDates().map(toISODate);
    var c = {pendente:0, postado:0, removido:0};
    state.posts.forEach(function(p){
      if(dates.indexOf(p.date) !== -1 && c.hasOwnProperty(p.status)) c[p.status]++;
    });
    return c;
  }
  function dayStatusSet(dateISO){
    var set = {};
    postsOnDate(dateISO).forEach(function(p){ set[p.status] = true; });
    return set;
  }

  function statusColorVar(status){
    return status === "pendente" ? "var(--red)" : status === "postado" ? "var(--green)" : "var(--blue)";
  }

  var REMINDER_LEADS = [
    {id:"-PT0M", label:"No horário"},
    {id:"-PT15M", label:"15 minutos antes"},
    {id:"-PT60M", label:"1 hora antes"},
    {id:"-P1D", label:"1 dia antes"}
  ];

  function icsStamp(){
    var d = new Date();
    return d.getUTCFullYear() + pad(d.getUTCMonth()+1) + pad(d.getUTCDate()) + "T" + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + "Z";
  }
  function icsDateTime(dateISO, time){
    var dp = dateISO.split("-");
    var tp = (time || "09:00").split(":");
    return dp[0] + dp[1] + dp[2] + "T" + pad(parseInt(tp[0],10)||0) + pad(parseInt(tp[1],10)||0) + "00";
  }
  function icsEscape(s){
    return String(s == null ? "" : s).replace(/([,;])/g, "\\$1").replace(/\n/g, "\\n");
  }
  function buildICS(events){
    var lines = ["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//Posts App//PT","CALSCALE:GREGORIAN"];
    events.forEach(function(ev){
      lines.push("BEGIN:VEVENT");
      lines.push("UID:" + ev.id + "-" + ev.date + "@posts-app.local");
      lines.push("DTSTAMP:" + icsStamp());
      lines.push("DTSTART:" + icsDateTime(ev.date, ev.time));
      lines.push("DURATION:PT15M");
      lines.push("SUMMARY:" + icsEscape("Postar: " + ev.type + (ev.caption ? " — " + ev.caption : "")));
      lines.push("DESCRIPTION:" + icsEscape("Lembrete do app Posts para publicar no Instagram."));
      lines.push("BEGIN:VALARM");
      lines.push("ACTION:DISPLAY");
      lines.push("DESCRIPTION:Hora de postar");
      lines.push("TRIGGER:" + (ev.lead || "-PT15M"));
      lines.push("END:VALARM");
      lines.push("END:VEVENT");
    });
    lines.push("END:VCALENDAR");
    return lines.join("\r\n");
  }
  function openICS(events){
    events = (events || []).filter(function(ev){ return ev.time; });
    if(!events.length) return;
    var ics = buildICS(events);
    var uri = "data:text/calendar;charset=utf-8," + encodeURIComponent(ics);
    var frame = document.createElement("iframe");
    frame.style.display = "none";
    frame.src = uri;
    document.body.appendChild(frame);
    setTimeout(function(){ if(frame.parentNode) frame.parentNode.removeChild(frame); }, 4000);
  }

  // ---------- rendering ----------

  function render(){
    var dates = weekDates();
    var counts = weekCounts();
    var selPosts = postsOnDate(state.selectedDate);

    var html = "";
    html += '<div class="header">';
    html +=   '<div class="header-top">';
    html +=     '<h1>Programação de Posts</h1>';
    html +=     '<div class="week-nav">';
    html +=       '<button class="icon-btn" data-action="prev-week" aria-label="Semana anterior">' + ICON.chevronLeft + '</button>';
    html +=       '<span class="week-label">' + escapeHtml(weekLabel()) + '</span>';
    html +=       '<button class="icon-btn" data-action="next-week" aria-label="Próxima semana">' + ICON.chevronRight + '</button>';
    html +=     '</div>';
    html +=   '</div>';
    if(state.syncStatus === "error"){
      html +=   '<p class="sync-note is-error">Firebase não configurado — salvando só neste aparelho. Veja o comentário no topo do arquivo.</p>';
    } else if(state.syncStatus === "connecting"){
      html +=   '<p class="sync-note">Conectando...</p>';
    }

    html +=   '<div class="stats">';
    html +=     statBlock("pendente", counts.pendente, "Pendentes");
    html +=     '<div class="divider"></div>';
    html +=     statBlock("postado", counts.postado, "Postados");
    html +=     '<div class="divider"></div>';
    html +=     statBlock("removido", counts.removido, "Removidos");
    html +=   '</div>';

    html +=   '<div class="days">';
    dates.forEach(function(d){
      var iso = toISODate(d);
      var isSel = iso === state.selectedDate;
      var isToday = iso === todayISO;
      var statuses = dayStatusSet(iso);
      var dotsHtml = "";
      STATUSES.forEach(function(s){
        if(statuses[s.id]) dotsHtml += '<span class="dot" style="background:' + statusColorVar(s.id) + '"></span>';
      });
      html += '<button class="day' + (isSel ? ' is-selected' : '') + (isToday ? ' is-today' : '') + '" data-action="select-day" data-date="' + iso + '">';
      html +=   '<span class="dots">' + dotsHtml + '</span>';
      html +=   '<span class="ab">' + DAY_LABELS[(d.getDay()+6)%7] + '</span>';
      html +=   '<span class="num">' + d.getDate() + '</span>';
      html += '</button>';
    });
    html +=   '</div>';
    html += '</div>';

    html += '<div class="content">';
    html +=   '<p class="section-title">Posts de ' + escapeHtml(dayFullLabel(fromISODate(state.selectedDate))) + '</p>';
    if(selPosts.length === 0){
      html += '<div class="empty">';
      html +=   '<div class="empty-icon">' + ICON.calendar + '</div>';
      html +=   '<p>Nenhum post programado para este dia.</p>';
      html +=   '<button class="btn btn-primary" data-action="open-add">' + ICON.plus + ' Adicionar post</button>';
      html += '</div>';
    } else {
      selPosts.forEach(function(p){
        html += '<div class="post">';
        html +=   '<span class="bar" style="background:' + statusColorVar(p.status) + '"></span>';
        html +=   '<button class="post-main" data-action="open-edit" data-id="' + p.id + '">';
        html +=     '<span class="main">';
        html +=       '<span class="top"><span class="time">' + escapeHtml(p.time || "--:--") + '</span><span class="type">' + escapeHtml(p.type) + '</span></span>';
        html +=       '<span class="cap">' + escapeHtml(p.caption || "(sem legenda)") + '</span>';
        html +=     '</span>';
        html +=     '<span class="badge badge-' + p.status + '">' + statusLabel(p.status) + '</span>';
        html +=   '</button>';
        html +=   '<button class="post-bell" data-action="remind-post" data-id="' + p.id + '" aria-label="Lembrete deste post">' + ICON.bell + '</button>';
        html += '</div>';
      });
    }
    html += '</div>';

    html += '<button class="fab" data-action="open-add" aria-label="Adicionar novo post">' + ICON.plus + '</button>';

    html += sheetHtml();
    html += confirmHtml();

    app.innerHTML = html;
    document.body.classList.toggle("sheet-open", !!state.sheet || !!state.confirmDeleteId);
  }

  function statBlock(id, n, label){
    return '<div class="stat"><span class="num"><span class="dot" style="background:' + statusColorVar(id) + '"></span>' + n + '</span><span class="lbl">' + label + '</span></div>';
  }
  function statusLabel(id){
    for(var i=0;i<STATUSES.length;i++) if(STATUSES[i].id === id) return STATUSES[i].label;
    return id;
  }
  function dayFullLabel(d){
    return DAY_LABELS[(d.getDay()+6)%7] + ", " + pad(d.getDate()) + "/" + pad(d.getMonth()+1);
  }

  function sheetHtml(){
    if(!state.sheet) return "";
    var isEdit = state.sheet.mode === "edit";
    var draft = state.sheet.draft;
    var dates = weekDates();

    var dayField;
    if(isEdit){
      var dayOptions = dates.map(function(d){
        var iso = toISODate(d);
        var sel = iso === draft.date ? " selected" : "";
        return '<option value="' + iso + '"' + sel + '>' + dayFullLabel(d) + '</option>';
      }).join("");
      dayField = '<div class="field"><label for="f-date">Dia</label><select id="f-date" class="select" data-field="date">' + dayOptions + '</select></div>';
    } else {
      var dayChecks = dates.map(function(d){
        var iso = toISODate(d);
        var checked = draft.dates && draft.dates.indexOf(iso) !== -1;
        return '<button type="button" class="daychip' + (checked ? ' is-checked' : '') + '" data-action="toggle-date" data-date="' + iso + '">' +
          '<span class="daychip-check">' + (checked ? ICON.check : '') + '</span>' +
          '<span class="daychip-label">' + DAY_LABELS[(d.getDay()+6)%7] + ' ' + pad(d.getDate()) + '/' + pad(d.getMonth()+1) + '</span>' +
        '</button>';
      }).join("");
      dayField = '<div class="field"><label>Dias (pode marcar mais de um)</label><div class="daychips">' + dayChecks + '</div></div>';
    }

    var typeOptions = TYPES.map(function(t){
      var sel = t === draft.type ? " selected" : "";
      return '<option value="' + t + '"' + sel + '>' + t + '</option>';
    }).join("");

    var statusButtons = STATUSES.map(function(s){
      return '<button type="button" class="opt-' + s.id + (draft.status === s.id ? ' is-active' : '') + '" data-action="set-status" data-status="' + s.id + '">' + s.label + '</button>';
    }).join("");

    var html = '<div class="sheet-layer">';
    html +=   '<div class="sheet-backdrop" data-action="close-sheet"></div>';
    html +=   '<div class="sheet" role="dialog" aria-modal="true" aria-label="' + (isEdit ? "Editar post" : "Novo post") + '">';
    html +=     '<div class="sheet-grabber"></div>';
    html +=     '<div class="sheet-head"><h2>' + (isEdit ? "Editar post" : "Novo post") + '</h2>';
    html +=       '<button class="icon-btn" data-action="close-sheet" aria-label="Fechar">' + ICON.close + '</button></div>';
    html +=     '<div class="sheet-body">';
    html +=       dayField;
    html +=       '<div class="field"><label for="f-time">Horário</label><input id="f-time" class="input" type="time" data-field="time" value="' + escapeHtml(draft.time || "") + '"></div>';
    html +=       '<div class="field"><label for="f-type">Tipo de conteúdo</label><select id="f-type" class="select" data-field="type">' + typeOptions + '</select></div>';
    html +=       '<div class="field"><label for="f-caption">Legenda / descrição</label><textarea id="f-caption" class="textarea" data-field="caption" placeholder="Sobre o que é o post...">' + escapeHtml(draft.caption || "") + '</textarea></div>';
    html +=       '<div class="field"><label>Status</label><div class="segmented">' + statusButtons + '</div></div>';
    var leadOptions = REMINDER_LEADS.map(function(r){
      var sel = r.id === (draft.reminderLead || "-PT15M") ? " selected" : "";
      return '<option value="' + r.id + '"' + sel + '>' + r.label + '</option>';
    }).join("");
    html +=       '<div class="field"><label class="checkbox-row"><input type="checkbox" data-field="reminder"' + (draft.reminder ? ' checked' : '') + '> Criar lembrete no Calendário</label>';
    if(draft.reminder){
      html +=     '<select class="select reminder-lead" data-field="reminderLead">' + leadOptions + '</select>';
    }
    html +=       '</div>';
    html +=       '<div class="sheet-actions">';
    var addLabel = "Adicionar post";
    if(!isEdit){
      var nSel = (draft.dates && draft.dates.length) || 1;
      addLabel = nSel > 1 ? ("Adicionar em " + nSel + " dias") : "Adicionar post";
    }
    html +=         '<button class="btn btn-primary btn-block" data-action="save-post">' + (isEdit ? "Salvar alterações" : addLabel) + '</button>';
    if(isEdit){
      html +=       '<button class="btn btn-danger btn-block" data-action="ask-delete">Excluir post</button>';
    }
    html +=       '</div>';
    html +=     '</div>';
    html +=   '</div>';
    html += '</div>';
    return html;
  }

  function confirmHtml(){
    if(!state.confirmDeleteId) return "";
    return (
      '<div class="confirm-layer">' +
        '<div class="confirm-backdrop" data-action="cancel-delete"></div>' +
        '<div class="confirm" role="alertdialog" aria-modal="true" aria-label="Excluir post">' +
          '<h2>Excluir este post?</h2>' +
          '<p>Essa ação não pode ser desfeita.</p>' +
          '<div class="confirm-actions">' +
            '<button class="btn btn-secondary" data-action="cancel-delete">Cancelar</button>' +
            '<button class="btn btn-danger" data-action="confirm-delete">Excluir</button>' +
          '</div>' +
        '</div>' +
      '</div>'
    );
  }

  var ICON = {
    plus: '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>',
    close: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><line x1="6" y1="6" x2="18" y2="18"></line><line x1="18" y1="6" x2="6" y2="18"></line></svg>',
    chevronLeft: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 6 9 12 15 18"></polyline></svg>',
    chevronRight: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"></polyline></svg>',
    calendar: '<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><line x1="3" y1="10" x2="21" y2="10"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="16" y1="2" x2="16" y2="6"></line></svg>',
    check: '<svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 12 9 17 20 6"></polyline></svg>',
    bell: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 4 1.5 5.5 2 6H4c.5-.5 2-2 2-6Z"></path><path d="M10 19a2 2 0 0 0 4 0"></path></svg>'
  };

  // ---------- actions ----------

  var app = document.getElementById("app");

  app.addEventListener("click", function(e){
    var el = e.target.closest("[data-action]");
    if(!el) return;
    var action = el.getAttribute("data-action");

    if(action === "prev-week"){ state.weekStart = addDays(state.weekStart, -7); render(); return; }
    if(action === "next-week"){ state.weekStart = addDays(state.weekStart, 7); render(); return; }

    if(action === "select-day"){ state.selectedDate = el.getAttribute("data-date"); render(); return; }

    if(action === "toggle-date"){
      var dte = el.getAttribute("data-date");
      var arr = state.sheet.draft.dates || [];
      var di = arr.indexOf(dte);
      if(di === -1) arr.push(dte); else arr.splice(di,1);
      state.sheet.draft.dates = arr;
      render();
      return;
    }

    if(action === "open-add"){
      state.sheet = { mode:"add", draft:{ id:uid(), date: state.selectedDate, dates:[state.selectedDate], time:"", type:"Feed", caption:"", status:"pendente", reminder:true, reminderLead:"-PT15M" } };
      render();
      return;
    }
    if(action === "open-edit"){
      var id = el.getAttribute("data-id");
      var p = state.posts.find(function(x){ return x.id === id; });
      if(!p) return;
      var editDraft = Object.assign({}, p);
      if(editDraft.reminder === undefined) editDraft.reminder = true;
      if(!editDraft.reminderLead) editDraft.reminderLead = "-PT15M";
      state.sheet = { mode:"edit", draft: editDraft };
      render();
      return;
    }
    if(action === "remind-post"){
      var rid = el.getAttribute("data-id");
      var rp = state.posts.find(function(x){ return x.id === rid; });
      if(rp) openICS([{ id: rp.id, date: rp.date, time: rp.time, type: rp.type, caption: rp.caption, lead: rp.reminderLead || "-PT15M" }]);
      return;
    }

    if(action === "close-sheet"){ state.sheet = null; render(); return; }

    if(action === "set-status"){
      state.sheet.draft.status = el.getAttribute("data-status");
      render();
      return;
    }

    if(action === "save-post"){
      var d = state.sheet.draft;
      var remindEvents = [];
      if(state.sheet.mode === "add"){
        var chosenDates = (d.dates && d.dates.length) ? d.dates.slice() : [state.selectedDate];
        chosenDates.forEach(function(dt, i){
          var copy = Object.assign({}, d, { id: i === 0 ? d.id : uid(), date: dt });
          delete copy.dates;
          state.posts.push(copy);
          persistUpsert(copy);
          if(d.reminder) remindEvents.push({ id: copy.id, date: copy.date, time: copy.time, type: copy.type, caption: copy.caption, lead: d.reminderLead });
        });
        state.selectedDate = chosenDates[0];
      } else {
        if(!d.date) d.date = state.selectedDate;
        var idx = state.posts.findIndex(function(x){ return x.id === d.id; });
        if(idx === -1) state.posts.push(d);
        else state.posts[idx] = d;
        persistUpsert(d);
        state.selectedDate = d.date;
        if(d.reminder) remindEvents.push({ id: d.id, date: d.date, time: d.time, type: d.type, caption: d.caption, lead: d.reminderLead });
      }
      state.sheet = null;
      render();
      if(remindEvents.length) openICS(remindEvents);
      return;
    }

    if(action === "ask-delete"){
      state.confirmDeleteId = state.sheet.draft.id;
      render();
      return;
    }
    if(action === "cancel-delete"){ state.confirmDeleteId = null; render(); return; }
    if(action === "confirm-delete"){
      var delId = state.confirmDeleteId;
      state.posts = state.posts.filter(function(x){ return x.id !== delId; });
      persistDelete(delId);
      state.confirmDeleteId = null;
      state.sheet = null;
      render();
      return;
    }
  });

  app.addEventListener("input", function(e){
    var el = e.target.closest("[data-field]");
    if(!el || !state.sheet) return;
    var val = (el.type === "checkbox") ? el.checked : el.value;
    state.sheet.draft[el.getAttribute("data-field")] = val;
  });
  app.addEventListener("change", function(e){
    var el = e.target.closest("[data-field]");
    if(!el || !state.sheet) return;
    var val = (el.type === "checkbox") ? el.checked : el.value;
    state.sheet.draft[el.getAttribute("data-field")] = val;
    if(el.type === "checkbox") render();
  });

  initApp();
})();
</script>
</body>
</html>
